<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Optimum Service</title>

  <style>

    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }

    body {

      font-family: Arial, sans-serif;

      background: #071b35;

      color: white;

    }

    .cover {

      min-height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 25px;

      background:

        linear-gradient(

          rgba(4, 18, 40, 0.75),

          rgba(4, 18, 40, 0.88)

        ),

        url("https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1800&q=85")

        center / cover no-repeat;

    }

    .logo {

      font-size: 20px;

      font-weight: bold;

      letter-spacing: 4px;

      color: #d9b66f;

      margin-bottom: 50px;

    }

    h1 {

      font-size: clamp(35px, 6vw, 60px);

      margin-bottom: 20px;

    }

    h1 span {

      color: #d9b66f;

    }

    .description {

      max-width: 550px;

      line-height: 1.8;

      font-size: 17px;

      color: #e1e7ef;

      margin-bottom: 35px;

    }

    .button {

      display: inline-block;

      padding: 17px 40px;

      background: #d9b66f;

      color: #071b35;

      text-decoration: none;

      font-weight: bold;

      border-radius: 5px;

      transition: 0.3s;

    }

    .button:hover {

      background: white;

      transform: translateY(-3px);

    }

    footer {

      margin-top: 70px;

      font-size: 12px;

      color: #c5cedb;

    }

  </style>

</head>

<body>

  <main class="cover">

    <div class="logo">OPTIMUM SERVICE</div>

    <h1>

      Welcome to<br>

      <span>Optimum Service</span>

    </h1>

    <p class="description">

      Thank you for visiting Optimum Service.

      We are committed to providing reliable,

      professional and exceptional service.

      Click below to continue to our website.

    </p>

    <a

      class="button"

      href="https://YOUR-WEBSITE-LINK.com"

    >

      Continue to Website →

    </a>

    <footer>

      © 2026 Optimum Service. All rights reserved.

    </footer>

  </main>

</body>

</html>
